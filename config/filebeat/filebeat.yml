###################### Filebeat Configuration Example #########################

# This file is an example configuration file highlighting only the most common
# options. The filebeat.reference.yml file from the same directory contains all the
# supported options with more comments. You can use it as a reference.
#
# You can find the full configuration reference here:
# https://www.elastic.co/guide/en/beats/filebeat/index.html

# For more available modules and options, please see the filebeat.reference.yml sample
# configuration file.

# ============================== Filebeat inputs ===============================

filebeat.inputs:

- type: log
  enabled: true
  paths:
    - path\DocSpace\Logs\*.sql.log
  tags: ["sql"]
   
- type: log
  enabled: true
  paths:
    - path\DocSpace\Logs\*.log
  tags: ["logs"]
  exclude_files: ['\.sql.log$']
  
- type: log
  enabled: true
  paths:
    - path\DocSpace\Logs\*.asp.log
  tags: ["asp"]
  
# ============================== Filebeat modules ==============================

filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false


# ======================= Elasticsearch template setting =======================

setup.template.settings:
  index.number_of_shards: 1

setup.dashboards.enabled: true

setup.kibana:
  host: "http://localhost:5601"

# ------------------------------ Logstash Output -------------------------------
output.logstash:
  hosts: ["localhost:5044"]

# ================================= Processors =================================
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_docker_metadata: ~
  - add_kubernetes_metadata: ~
  - drop_fields:
      fields: ["agent.ephemeral_id", "agent.hostname", "agent.id", "agent.type", "agent.version", "ecs.version", "input.type", "log.offset", "version", "host.os.version", "host.os.type", "host.os.platform", "host.os.name.text", "host.os.name", "host.os.kernel", "host.os.family", "host.os.build", "host.name.text", "host.name", "host.mac", "host.ip", "host.id", "host.hostname", "host.architecture", "agent.name", "agent.name.text", "data_stream.dataset", "data_stream.namespace"]
