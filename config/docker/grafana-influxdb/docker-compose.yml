networks:
  k6:
    external: true
  grafana:

services:
  influxdb:
    image: influxdb:latest
    container_name: influxdb
    networks:
      - grafana 
      - k6 
    ports:
      - 8086:8086
    environment:
      - INFLUXDB_BUCKET=k6
      - INFLUXDB_HTTP_BIND_ADDRESS=:8086
    
  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    networks:
      - grafana
    ports:
      - 3000:3000
    depends_on:
      - influxdb
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
